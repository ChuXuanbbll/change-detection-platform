events {
    worker_connections 1024;
}

http {
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    include       mime.types;
    default_type  application/octet-stream;

    # Docker 内嵌 DNS：配合变量 proxy_pass 实现上游主机运行时解析，
    # 避免 nginx 启动时因上游容器尚未就绪而 emerg 退出。
    resolver 127.0.0.11 valid=30s ipv6=off;

    # 用变量缓存上游地址，避免每次请求重新解析
    map "" $go_api {
        default http://go-api:8080;
    }
    map "" $py_algo {
        default http://py-algo:8090;
    }

    server {
        listen 80;
        server_name localhost 127.0.0.1;
        # Compose publishes only host loopback. Reject other containers and
        # preserve the local-only policy at the actual ingress as well.
        allow 172.30.88.1;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        if ($host !~ ^(localhost|127\.0\.0\.1)$) { return 403; }
        client_max_body_size 2048M;

        location /health {
            proxy_pass $go_api$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /py/admin/ { return 403; }

        location /api/ {
            proxy_set_header X-CDP-Proxy "__CONTROL_TOKEN__";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Forwarded "";
            proxy_pass $go_api$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 600s;
        }

        location /py/ {
            proxy_pass $py_algo$request_uri;
            proxy_set_header Host $host;
            proxy_read_timeout 600s;
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}