id: change.detect.v1
version: "1.0.0"
description: Validate imagery and submit a bounded change detection workflow.
max_steps: 24
input_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  properties:
    operation: {type: string, enum: [query, detect, inspect]}
    admin_path: {type: array, minItems: 1, maxItems: 8, items: {type: string, minLength: 1, maxLength: 128}}
    region_id: {type: string, minLength: 1, maxLength: 128}
    date_range:
      type: object
      additionalProperties: false
      properties:
        start: {type: string, minLength: 4, maxLength: 32}
        end: {type: string, minLength: 4, maxLength: 32}
        precision: {type: string, enum: [day, month, year]}
      required: [start, end, precision]
    pair_policy: {type: string, enum: [first_last, adjacent, specified]}
    aoi:
      type: object
      additionalProperties: false
      properties:
        type: {type: string, enum: [Polygon]}
        coordinates:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: array
            minItems: 4
            maxItems: 10001
            items:
              type: array
              minItems: 2
              maxItems: 2
              items: {type: number}
      required: [type, coordinates]
    model_id: {type: string, minLength: 1, maxLength: 128}
output_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  properties:
    plan_id: {type: string}
    operation_id: {type: string}
    workflow_id: {type: string}
    task_ids: {type: array, maxItems: 500, items: {type: string, maxLength: 128}}
    status: {type: string}
allowed_tools:
  - workspace.context
  - region.search
  - imagery.scenes
  - model.list
  - selection.validate
  - detection.plan.create
  - imagery.prepare
  - detection.workflow.submit
  - operation.status
  - task.status
  - result.summary
  - ui.select_region
  - ui.load_phases
  - ui.set_existing_aoi
  - ui.fly_to_bounds
  - ui.show_task
  - ui.show_result
clarification_rules:
  - Resolve the complete province/city/county path before using an administrative region.
  - A county MultiPolygon cannot be used directly as a detection AOI; ask the user to draw or select one single valid Polygon.
  - If the date range has fewer than two valid phases, stop and report SINGLE_PHASE.
  - For adjacent comparisons, missing months must be reported and the user must choose whether to continue available pairs.
  - The current model provides change masks and scores only; it cannot classify buildings, roads, or illegal land use.
  - A plain date range uses the first and last valid phases; use adjacent pairs only when the user asks for month-by-month comparison.
  - Relative ranges are measured from the newest available catalog date and retain its day, month, or year precision.
failure_map:
  SINGLE_PHASE: ask_for_second_phase
  NO_COVERAGE: ask_for_different_dates_or_aoi
  AOI_INVALID: ask_for_valid_single_polygon
  OPERATION_NOT_READY: wait_for_operation_status
  MODEL_NOT_READY: ask_for_ready_model
steps:
  - id: context
    tool: workspace.context
  - id: region
    tool: region.search
    requires: [context]
  - id: scenes
    tool: imagery.scenes
    requires: [region]
  - id: select_region
    tool: ui.select_region
    requires: [region]
  - id: load_phases
    tool: ui.load_phases
    requires: [scenes]
  - id: model
    tool: model.list
    requires: [context]
  - id: selection
    tool: selection.validate
    requires: [scenes]
  - id: set_aoi
    tool: ui.set_existing_aoi
    requires: [selection]
  - id: fly_to_bounds
    tool: ui.fly_to_bounds
    requires: [region]
  - id: plan
    tool: detection.plan.create
    requires: [selection]
  - id: prepare
    tool: imagery.prepare
    requires: [plan]
  - id: operation
    tool: operation.status
    requires: [prepare]
  - id: submit
    tool: detection.workflow.submit
    requires: [plan, operation]
  - id: task
    tool: task.status
    requires: [submit]
  - id: show_task
    tool: ui.show_task
    requires: [task]
  - id: summary
    tool: result.summary
    requires: [task]
  - id: show_result
    tool: ui.show_result
    requires: [summary]
