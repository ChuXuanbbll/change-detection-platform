id: imagery.explore.v1
version: "1.0.0"
description: Explore available regions and imagery, then update the workspace map.
max_steps: 8
input_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  properties:
    operation: {type: string, enum: [query, locate]}
    admin_path: {type: array, minItems: 1, maxItems: 8, items: {type: string, minLength: 1, maxLength: 128}}
    region_id: {type: string, minLength: 1, maxLength: 128}
    date_range:
      type: object
      additionalProperties: false
      properties:
        start: {type: string, minLength: 4, maxLength: 32}
        end: {type: string, minLength: 4, maxLength: 32}
        precision: {type: string, enum: [day, month, year]}
    use_workspace_context: {type: boolean}
output_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  properties:
    status: {type: string, enum: [ok, needs_clarification]}
    region_id: {type: string}
    bounds: {type: array, minItems: 4, maxItems: 4, items: {type: number}}
    phase_ids: {type: array, maxItems: 128, items: {type: string}}
    scene_ids: {type: array, maxItems: 128, items: {type: string}}
    count: {type: integer, minimum: 0, maximum: 10000}
allowed_tools:
  - workspace.context
  - region.search
  - imagery.catalog
  - imagery.scenes
  - ui.select_region
  - ui.load_phases
  - ui.fly_to_bounds
clarification_rules:
  - Ask for an administrative level when multiple regions match.
  - Ask for a valid map AOI when the user asks to inspect the current selection and none exists.
  - Ask for a complete administrative path when a name is ambiguous or incomplete.
  - Report the actual available date precision and never invent a day from a month or year.
failure_map:
  RESOURCE_NOT_FOUND: ask_for_region
  SCENE_UNAVAILABLE: ask_for_date
  REGION_AMBIGUOUS: ask_for_administrative_level
steps:
  - id: context
    tool: workspace.context
  - id: catalog
    tool: imagery.catalog
    requires: [context]
  - id: region
    tool: region.search
    requires: [catalog]
  - id: scenes
    tool: imagery.scenes
    requires: [region]
  - id: select_region
    tool: ui.select_region
    requires: [region]
  - id: load_phases
    tool: ui.load_phases
    requires: [scenes]
  - id: fly_to_bounds
    tool: ui.fly_to_bounds
    requires: [region]
